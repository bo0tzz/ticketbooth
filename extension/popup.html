<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      body {
        width: 320px;
        margin: 12px;
        font: 13px system-ui, sans-serif;
      }
      label {
        display: block;
        margin-bottom: 8px;
      }
      input {
        box-sizing: border-box;
        width: 100%;
        margin-top: 2px;
        font: 13px monospace;
      }
      .hint {
        color: #666;
        font-size: 11px;
      }
      .buttons {
        display: flex;
        gap: 8px;
        margin: 8px 0;
      }
      button {
        flex: 1;
      }
      table {
        width: 100%;
        border-collapse: collapse;
        font-family: monospace;
      }
      td {
        padding: 1px 0;
      }
      td:last-child {
        text-align: right;
      }
      #error,
      #warning {
        color: #b3261e;
      }
    </style>
  </head>
  <body>
    <label>
      Target time (server clock)
      <input id="target" placeholder="2026-12-01 10:00:00 or 10:00:00.000" />
      <span class="hint" id="resolved"></span>
    </label>
    <label>
      Lead (ms): reload fires at T - (RTT/2 + lead)
      <input id="lead" type="number" step="1" value="5" />
    </label>
    <div class="buttons">
      <button id="arm">Arm this tab</button>
      <button id="disarm">Disarm</button>
    </div>
    <div id="error"></div>
    <table>
      <tr><td>State</td><td id="phase">idle</td></tr>
      <tr><td>Countdown</td><td id="countdown">-</td></tr>
      <tr><td>Server time</td><td id="server">-</td></tr>
      <tr><td>Clock offset</td><td id="offset">-</td></tr>
      <tr><td>RTT</td><td id="rtt">-</td></tr>
    </table>
    <div id="warning"></div>
    <script src="popup.js"></script>
  </body>
</html>
